name: CI

on:
  push:
    branches-ignore:
      - 'nobuild/**'

# Cancel superseded runs on the same ref, so a fresh push doesn't wait behind a stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check ink-frame
        run: bunx @oliveryasuna/ts-task ink-frame:ci
